const COLORS=['#59a9ed','#ad82ee','#fa7898','#69cba8','#ec9c61','#708ddd','#b2bd65','#cf82c4','#6fc6d2','#dc7373'];
let level=0,positions=[],moves=0,history=[],coins=0,unlocked=1,drag=null,won=false;
try{const s=JSON.parse(localStorage.getItem('parkingJamV1')||'{}');coins=s.coins||0;unlocked=Math.max(1,Math.min(LEVELS.length,s.unlocked||1));level=Math.min(unlocked-1,s.level||0)}catch(e){}
const $=id=>document.getElementById(id), board=$('board');
function save(){try{localStorage.setItem('parkingJamV1',JSON.stringify({coins,unlocked,level}))}catch(e){}}
function occupied(state,skip=-1){let set=new Set();LEVELS[level].cars.forEach((c,i)=>{if(i===skip)return;for(let k=0;k<c.l;k++)set.add(c.o==='H'?`${c.f},${state[i]+k}`:`${state[i]+k},${c.f}`)});return set}
function canPlace(i,p,state){const c=LEVELS[level].cars[i];if(p<0||p+c.l>6)return false;const occ=occupied(state,i);for(let k=0;k<c.l;k++)if(occ.has(c.o==='H'?`${c.f},${p+k}`:`${p+k},${c.f}`))return false;return true}
function legalMoves(state){let out=[];LEVELS[level].cars.forEach((c,i)=>{for(let d of [-1,1]){let p=state[i]+d;while(canPlace(i,p,state)){out.push([i,p]);p+=d}}});return out}
function solution(state){const key=s=>s.join(',');let q=[state.slice()],seen=new Set([key(state)]),parents=new Map(),head=0;while(head<q.length&&q.length<70000){let s=q[head++],k=key(s);if(s[0]===4){let path=[];while(parents.has(k)){let [old,m]=parents.get(k);path.push(m);k=old}return path.reverse()}for(let m of legalMoves(s)){let t=s.slice();t[m[0]]=m[1];let tk=key(t);if(!seen.has(tk)){seen.add(tk);parents.set(tk,[k,m]);q.push(t)}}}return null}

function load(i){level=i;positions=LEVELS[i].cars.map(c=>c.p);moves=0;history=[];won=false;$('overlay').classList.remove('show');render();save()}
function commit(i,p){if(won||positions[i]===p||!canPlace(i,p,positions))return;history.push(positions.slice());positions[i]=p;moves++;render();if(i===0&&p===4)finish()}
function startDrag(e){if(won)return;e.preventDefault();const i=Number(e.currentTarget.dataset.i),c=LEVELS[level].cars[i];drag={i,orig:positions[i],x:e.clientX,y:e.clientY,el:e.currentTarget};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.addEventListener('pointermove',moveDrag);e.currentTarget.addEventListener('pointerup',endDrag,{once:true});e.currentTarget.addEventListener('pointercancel',endDrag,{once:true})}
function dragPos(e){let c=LEVELS[level].cars[drag.i],delta=(c.o==='H'?e.clientX-drag.x:e.clientY-drag.y)/(board.getBoundingClientRect().width/6);let wanted=drag.orig+Math.round(delta);if(wanted===drag.orig)return wanted;let d=Math.sign(wanted-drag.orig),p=drag.orig;while(p!==wanted&&canPlace(drag.i,p+d,positions))p+=d;return p}
function moveDrag(e){if(!drag)return;const c=LEVELS[level].cars[drag.i],p=dragPos(e);if(c.o==='H')drag.el.style.left=p/6*100+'%';else drag.el.style.top=p/6*100+'%'}
function endDrag(e){if(!drag)return;let i=drag.i,p=dragPos(e),el=drag.el;el.removeEventListener('pointermove',moveDrag);drag=null;commit(i,p);if(positions[i]!==p)render()}
function finish(){won=true;const gain=Math.max(10,45-Math.max(0,moves-LEVELS[level].optimal)*3);coins+=gain;unlocked=Math.max(unlocked,Math.min(LEVELS.length,level+2));save();$('result').innerHTML=`用了 <b>${moves}</b> 步，最佳解 <b>${LEVELS[level].optimal}</b> 步。<br>獲得 🪙 <b>${gain}</b> 金幣！`;$('next').textContent=level===LEVELS.length-1?'全部通關！重新挑戰':'下一關 ➜';$('overlay').classList.add('show');$('coins').textContent=coins}
$('undo').onclick=()=>{if(history.length){positions=history.pop();moves=Math.max(0,moves-1);render()}};$('reset').onclick=()=>load(level);$('hint').onclick=()=>{let path=solution(positions);if(path===null)toast('目前無法解開，請重玩');else if(!path.length)toast('把黃色車開到出口！');else{let [i,p]=path[0];toast(`提示：先移動${i===0?'黃色車':`第 ${i+1} 輛車`} ${p>positions[i]?'往右／下':'往左／上'}`);board.querySelector(`[data-i="${i}"]`)?.animate([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:700,iterations:2})}};$('next').onclick=()=>load(level===LEVELS.length-1?0:level+1);$('replay').onclick=()=>load(level);load(level);
</script></body></html>
