<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7e9"><title>萌寵 Color Jam V3</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#273346;background:radial-gradient(circle at 15% 12%,#fff1c9,transparent 35%),radial-gradient(circle at 90% 85%,#d7f6f0,transparent 40%),#f8f6f0}body{display:flex;justify-content:center}.app{width:min(100%,510px);min-height:100dvh;padding:calc(13px + env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.logo{font-size:29px;background:white;border-radius:17px;padding:8px;box-shadow:0 5px 16px #d6c4a75c}.brand strong{font-size:22px;display:block;letter-spacing:.4px}.brand small{font-size:11px;color:#82909b}.coin{background:#fff;border-radius:30px;padding:10px 15px;font-weight:900;box-shadow:0 5px 18px #d6c4a747}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#fff;border-radius:17px;padding:11px 4px;text-align:center;box-shadow:0 5px 15px #c6d2cc24}.stat small{display:block;color:#81909a;font-weight:800;font-size:11px}.stat strong{font-size:22px}.progress{height:9px;background:#e7e6df;border-radius:20px;overflow:hidden}.progress i{display:block;background:linear-gradient(90deg,#6bd2a7,#24bb86);height:100%;width:0%;border-radius:20px;transition:width .3s}.stage{position:relative;width:100%;aspect-ratio:1/1.2;max-height:58dvh;min-height:310px;touch-action:manipulation;filter:drop-shadow(0 12px 20px #9eaf9a45)}canvas{width:100%;height:100%;display:block;border-radius:28px}.tip{text-align:center;min-height:44px;font-weight:800;font-size:14px;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{border:0;border-radius:17px;padding:14px 6px;font-weight:900;color:#28384a;font-size:13px;cursor:pointer;box-shadow:0 4px 10px #a5ad9c30}button:active{transform:scale(.97)}.hint{background:#fff0b5}.restart{background:#fff}.next{background:#c5f1de}.footer{text-align:center;font-size:11px;color:#92a09f}.veil{position:fixed;inset:0;background:#1b314a8e;display:none;justify-content:center;align-items:center;padding:20px;z-index:3}.veil.show{display:flex}.modal{width:min(100%,370px);background:white;border-radius:30px;padding:27px 20px;text-align:center;box-shadow:0 25px 70px #14243a55}.modal .big{font-size:60px}.modal h2{font-size:28px;margin:10px 0}.modal p{color:#65717f;line-height:1.7}.modal button{background:#39ca94;width:100%;font-size:17px;color:#fff;margin-top:10px}.banner{background:#ffffffc9;border-radius:15px;text-align:center;font-size:12px;padding:10px;font-weight:700;color:#647d7c}.banner b{color:#27ae83}@media(max-height:720px){.app{gap:7px;padding-top:8px}.stage{max-height:53dvh}.brand strong{font-size:19px}.stat{padding:6px}.actions button{padding:10px 4px}.banner{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">🐾</div><div><strong>萌寵 Color Jam</strong><small>動物大逃脫 · V3 可玩測試版</small></div></div><div class="coin">🪙 <span id="coins">0</span></div></header><div class="stats"><div class="stat"><small>關卡</small><strong id="level">1/24</strong></div><div class="stat"><small>待逃脫</small><strong id="left">0</strong></div><div class="stat"><small>連續逃脫</small><strong id="combo">0</strong></div></div><div class="progress"><i id="bar"></i></div><div class="stage"><canvas id="board"></canvas></div><div class="tip" id="tip">點擊動物，讓牠前往同色出口！</div><div class="actions"><button class="hint" id="hint">💡 提示</button><button class="restart" id="restart">↻ 重玩</button><button class="next" id="sound">🔊 音效開</button></div><div class="banner">🟢 綠門　🔵 藍門　🟠 橘門　🟣 紫門　｜　<b>先救出能走的動物！</b></div><div class="footer">原創玩法測試 · 24 關 · 無廣告 · 可在手機觸控操作</div></main><div class="veil" id="veil"><div class="modal"><div class="big">🎉</div><h2 id="winTitle">闖關成功！</h2><p id="winText">所有萌寵都安全逃出！</p><button id="advance">挑戰下一關 →</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const N=6,ROWS=7,COLORS=['#42c991','#5aabf5','#ffb458','#ae89f5'],NAMES=['綠','藍','橘','紫'],EMOJI=['🐶','🐱','🐰','🐥','🐼','🦊','🐸','🐹'];const DIRS=[[-1,0],[0,1],[1,0],[0,-1]]; // top,right,bottom,left
let lvl=Number(localStorage.getItem('petjam_level')||1);lvl=Math.max(1,Math.min(24,lvl));let coins=Number(localStorage.getItem('petjam_coins')||0),animals=[],initial=[],total=0,combo=0,moving=[],sparks=[],hintId=-1,muted=false,busy=false,last=performance.now(),shake=new Map();let box={x:0,y:0,w:0,h:0,cw:0,ch:0},W=400,H=490;
const rand=(seed)=>()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const occupied=(list,r,c)=>list.some(a=>a.r===r&&a.c===c);function pathClear(a,list){let [dr,dc]=DIRS[a.col];for(let r=a.r+dr,c=a.c+dc;r>=0&&r<ROWS&&c>=0&&c<N;r+=dr,c+=dc){if(occupied(list,r,c))return false}return true}
function solvable(list){let arr=list.map(a=>({...a}));while(arr.length){const i=arr.findIndex(a=>pathClear(a,arr));if(i<0)return false;arr.splice(i,1)}return true}
function makeLevel(index){const rng=rand(9781+index*7321),count=Math.min(7+Math.floor(index*.9),23);let list=[];let tries=0;while(list.length<count&&tries++<600){let col=Math.floor(rng()*4),r=Math.floor(rng()*ROWS),c=Math.floor(rng()*N);if(occupied(list,r,c))continue;let a={r,c,col,id:list.length+index*100,emoji:EMOJI[Math.floor(rng()*EMOJI.length)]};if(pathClear(a,list))list.push(a)}if(!solvable(list))throw Error('關卡生成錯誤');return list}
function resize(){let rect=canvas.getBoundingClientRect();let ratio=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);let gap=10;box.w=Math.min((W-54)/N,(H-86)/ROWS);box.ch=box.cw=box.w;box.x=(W-box.w*N)/2;box.y=(H-box.w*ROWS)/2;box.h=box.w*ROWS}
function roundRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()};function text(t,x,y,size=18,color='#24394b'){ctx.fillStyle=color;ctx.font=`900 ${size}px system-ui,Apple Color Emoji,Segoe UI Emoji`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function draw(t){ctx.clearRect(0,0,W,H);roundRect(2,2,W-4,H-4,27,'#fff');roundRect(8,8,W-16,H-16,23,'#e7f4d9');for(let i=0;i<ROWS;i++)for(let j=0;j<N;j++){roundRect(box.x+j*box.w+2,box.y+i*box.w+2,box.w-4,box.w-4,Math.max(6,box.w*.15),(i+j)%2?'#d8eccd':'#dff1d5')}
// Full-width colored gate rails, one color per side
const gates=[{x:box.x+box.w*1.35,y:box.y-18,w:box.w*3.3,h:18},{x:box.x+box.w*N+1,y:box.y+box.w*2,w:18,h:box.w*3},{x:box.x+box.w*1.35,y:box.y+box.h,w:box.w*3.3,h:18},{x:box.x-19,y:box.y+box.w*2,w:18,h:box.w*3}];gates.forEach((g,i)=>{roundRect(g.x,g.y,g.w,g.h,9,COLORS[i]);ctx.save();if(i===1||i===3){ctx.translate(g.x+g.w/2,g.y+g.h/2);ctx.rotate(i===1?Math.PI/2:-Math.PI/2);text(NAMES[i]+'色出口',0,0,Math.max(10,box.w*.23),'#fff')}else text(NAMES[i]+'色出口',g.x+g.w/2,g.y+g.h/2,Math.max(10,box.w*.23),'#fff');ctx.restore()});
function drawAnimal(a,x,y,alpha=1){ctx.save();ctx.globalAlpha=alpha;let size=box.w*.79;const shaking=shake.get(a.id);if(shaking&&t-shaking<380)x+=Math.sin((t-shaking)*.1)*4;roundRect(x-size/2,y-size/2+3,size,size,Math.max(10,size*.25),'#9bb7a64a');roundRect(x-size/2,y-size/2,size,size,Math.max(10,size*.25),COLORS[a.col]);roundRect(x-size*.43,y-size*.43,size*.86,size*.75,Math.max(8,size*.2),'#ffffffb8');text(a.emoji,x,y-size*.035,Math.min(35,size*.56));let [dr,dc]=DIRS[a.col];let ax=x+dc*size*.35,ay=y+dr*size*.35;ctx.beginPath();ctx.arc(ax,ay,Math.max(8,size*.17),0,Math.PI*2);ctx.fillStyle='#24334b';ctx.fill();text(['↑','→','↓','←'][a.col],ax,ay,Math.max(12,size*.25),'#fff');if(a.id===hintId){ctx.strokeStyle='#fff31b';ctx.lineWidth=4;ctx.strokeRect(x-size/2-2,y-size/2-2,size+4,size+4)}ctx.restore()}
animals.forEach(a=>drawAnimal(a,box.x+(a.c+.5)*box.w,box.y+(a.r+.5)*box.w));moving.forEach(m=>{let k=Math.min(1,(t-m.start)/m.duration);let eased=1-Math.pow(1-k,3);drawAnimal(m.a,m.x+(m.tx-m.x)*eased,m.y+(m.ty-m.y)*eased,1-k*.22)});sparks=sparks.filter(p=>t-p.start<700);sparks.forEach(p=>{let k=(t-p.start)/700;ctx.globalAlpha=1-k;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x+p.vx*k,p.y+p.vy*k+70*k*k,Math.max(1,4*(1-k)),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1});moving=moving.filter(m=>t-m.start<m.duration);if(busy&&!moving.length){busy=false;if(!animals.length)win()}requestAnimationFrame(draw)}
function beep(ok=true){if(muted)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let ac=window.__petAudio||(window.__petAudio=new A);if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(ok?550:220,ac.currentTime);o.frequency.exponentialRampToValueAtTime(ok?850:130,ac.currentTime+.12);g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.16)}catch(e){}}
function message(s){$('tip').textContent=s}function update(){ $('level').textContent=lvl+'/24';$('left').textContent=animals.length;$('combo').textContent=combo;$('coins').textContent=coins;$('bar').style.width=((total-animals.length)/total*100)+'%'}
function load(){initial=makeLevel(lvl);animals=initial.map(a=>({...a}));total=animals.length;moving=[];sparks=[];combo=0;hintId=-1;busy=false;$('veil').classList.remove('show');message('先讓有空路的萌寵跑向同色出口！');update()}
function win(){coins+=10+Math.min(30,combo*2);localStorage.setItem('petjam_coins',coins);$('coins').textContent=coins;$('winTitle').textContent=lvl===24?'全部 24 關通關！':'第 '+lvl+' 關完成！';$('winText').textContent='動物全部安全抵達同色出口！獲得金幣獎勵 🪙';$('advance').textContent=lvl===24?'再玩一次 ↻':'下一關 →';$('veil').classList.add('show');beep(true)}
function escapeAnimal(a){animals=animals.filter(z=>z.id!==a.id);let x=box.x+(a.c+.5)*box.w,y=box.y+(a.r+.5)*box.w;let [dr,dc]=DIRS[a.col];let tx=x+dc*box.w*(N+1),ty=y+dr*box.w*(ROWS+1);moving.push({a,x,y,tx,ty,start:performance.now(),duration:390+Math.abs(dc?tx-x:ty-y)*.27});for(let i=0;i<15;i++){let theta=Math.random()*Math.PI*2;sparks.push({x,y,vx:Math.cos(theta)*(35+Math.random()*60),vy:Math.sin(theta)*(35+Math.random()*60),start:performance.now(),color:COLORS[a.col]})}combo++;coins+=2;localStorage.setItem('petjam_coins',coins);hintId=-1;busy=true;message(['漂亮！同色出口接到萌寵！','連續逃脫！繼續清出道路！','好厲害！下一隻也準備好了！'][Math.min(2,combo-1)]);beep(true);update()}
canvas.addEventListener('pointerdown',e=>{if(busy||$('veil').classList.contains('show'))return;let rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,c=Math.floor((x-box.x)/box.w),r=Math.floor((y-box.y)/box.w);let a=animals.find(z=>z.r===r&&z.c===c);if(!a)return;if(pathClear(a,animals))escapeAnimal(a);else{shake.set(a.id,performance.now());combo=0;message('🚧 被其他動物擋住了！先讓前方的動物離開');update();beep(false);if(navigator.vibrate)navigator.vibrate(35)}});
$('hint').onclick=()=>{let a=animals.find(a=>pathClear(a,animals));if(a){hintId=a.id;message('💡 黃框動物現在可以順利逃脫！');beep(true)}else message('關卡異常，請按重玩')};$('restart').onclick=()=>load();$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 音效關':'🔊 音效開'};$('advance').onclick=()=>{lvl=lvl===24?1:lvl+1;localStorage.setItem('petjam_level',lvl);load()};window.addEventListener('resize',resize);resize();load();requestAnimationFrame(draw);
})();</script></body></html>
